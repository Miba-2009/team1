<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AIとデータベースを使ったWebアプリ制作用テンプレート">
    <title>AI Lab Chat</title>
    <link rel="stylesheet" href="style.css">
    <script src="lib/json-wrappers.js" defer></script>
    <script src="lib/response-wrapper.js" defer></script>
    <script src="lib/gas-client.js" defer></script>
    <script src="lib/easy-api.js" defer></script>
    <script src="lib/chat-ui.js" defer></script>
    <script src="js/app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <aside id="archive-sidebar" class="sidebar" aria-label="会話アーカイブ">
        <div class="sidebar-heading">
          <span>会話アーカイブ</span>
          <button id="close-sidebar" class="sidebar-close" type="button" aria-label="アーカイブを閉じる">×</button>
        </div>
        <button id="archive-button" class="archive-current" type="button">＋ 現在の会話を保存</button>
        <p id="archive-feedback" class="archive-feedback" aria-live="polite"></p>
        <div id="archive-list" class="archive-list"><p class="archive-empty">読み込み中…</p></div>
      </aside>

      <div class="main-panel">
        <header class="topbar">
          <button id="menu-button" class="menu-button" type="button" aria-label="アーカイブを開く" aria-expanded="false">☰</button>
          <a class="brand" href="#" aria-label="AI Lab Chat ホーム">
            <span class="brand-mark" aria-hidden="true">✦</span>
            <span>AI Lab <strong>Chat</strong></span>
          </a>
          <div class="status"><span class="status-dot" aria-hidden="true"></span>GAS 接続待ち</div>
        </header>

        <main class="chat" aria-labelledby="page-title">
          <section class="hero">
            <p class="eyebrow">WEB HACKATHON STARTER</p>
            <h1 id="page-title">AIに、何を相談しますか？</h1>
            <p>JavaScriptを書き換えて、あなただけのAIアプリに育てよう。</p>
          </section>

          <section id="messages" class="messages" aria-live="polite" aria-label="会話"></section>

          <section class="suggestions" aria-label="質問例">
            <button type="button" data-prompt="高校生向けの面白いWebアプリのアイデアを3つ考えて">💡 アイデアを考える</button>
            <button type="button" data-prompt="この文章をわかりやすく要約して">📝 文章を要約する</button>
            <button type="button" data-prompt="今日からできる勉強計画を作って">📚 勉強計画を作る</button>
          </section>

          <form id="chat-form" class="composer">
            <label class="sr-only" for="prompt">AIへの質問</label>
            <textarea id="prompt" rows="1" maxlength="4000" placeholder="メッセージを入力…" required></textarea>
            <button id="send-button" type="submit" aria-label="送信"><span aria-hidden="true">↑</span></button>
            <p class="composer-note">Enterで送信 ・ Shift + Enterで改行</p>
          </form>
        </main>

        <footer>AIの回答には誤りが含まれることがあります。大切な情報は確認しましょう。</footer>
      </div>
    </div>

    <dialog id="delete-dialog" class="delete-dialog">
      <form id="delete-form" method="dialog">
        <h2>アーカイブを削除しますか？</h2>
        <p>この操作は取り消せません。本当に削除する場合は以下の文言を入力してください。</p>
        <code id="delete-phrase"></code>
        <label for="delete-input">確認用の文言</label>
        <input id="delete-input" type="text" autocomplete="off" spellcheck="false">
        <p id="delete-error" class="delete-error" aria-live="polite"></p>
        <div class="dialog-actions">
          <button id="cancel-delete" type="button">キャンセル</button>
          <button id="confirm-delete" class="danger" type="submit" disabled>削除する</button>
        </div>
      </form>
    </dialog>

  </body>
</html>
