<!doctype html>
<html lang="ja">
<head>
  <!-- ここはページ全体の設定です。基本的には変更しなくて大丈夫です。 -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AI Webアプリ制作スターター">
  <title>AI Webアプリ制作スターター</title>

  <link rel="stylesheet" href="style.css">

  <!-- deferを付けると、HTMLを読み終わってから上から順番にJavaScriptが動きます。 -->
  <!-- libフォルダは便利な道具です。最初は中身を変更しなくて大丈夫です。 -->
  <script src="../lib/json-wrappers.js" defer></script>
  <script src="../lib/response-wrapper.js" defer></script>
  <script src="../lib/gas-client.js" defer></script>
  <script src="../lib/easy-api.js" defer></script>
  <script src="../lib/chat-ui.js" defer></script>

  <!-- 参加者が主に編集するJavaScriptです。必ず最後に読み込みます。 -->
  <script src="js/app.js" defer></script>
</head>
<body>
  <!-- TODO: アプリ名と説明を、自分たちの企画に合わせて変更しましょう。 -->
  <header class="site-header">
    <p class="label">AI WEB APP STARTER</p>
    <h1 id="app-title">ここにアプリ名を入れる</h1>
    <p id="app-description">誰の、どんな困りごとを解決するアプリか書いてください。</p>
    <p id="connection-status" class="status">GAS URLを確認中…</p>
  </header>

  <main class="app-shell">
    <!-- 左側: AIとの会話を表示する場所 -->
    <section class="panel chat-panel" aria-labelledby="chat-title">
      <div class="panel-heading">
        <p class="section-label">AI CHAT</p>
        <h2 id="chat-title">AIに質問する</h2>
      </div>

      <div id="message-list" class="message-list" aria-live="polite">
        <p class="empty-message">まだ会話はありません。</p>
      </div>

      <form id="chat-form" class="question-form">
        <label for="question-input">質問</label>
        <textarea id="question-input" rows="4" placeholder="例: 勉強を続けるコツを3つ教えて"></textarea>
        <div class="button-row">
          <button id="send-button" class="button primary" type="submit">AIへ送る</button>
          <button id="clear-button" class="button" type="button">会話を空にする</button>
        </div>
      </form>
    </section>

    <!-- 右側: 自分たちの機能を追加する場所 -->
    <aside class="panel idea-panel" aria-labelledby="idea-title">
      <div class="panel-heading">
        <p class="section-label">YOUR IDEA</p>
        <h2 id="idea-title">自分たちの機能</h2>
      </div>

      <!-- TODO: plan_expamle.mdで決めた入力欄やボタンへ置き換えます。 -->
      <div class="todo-card">
        <h3>TODO 1</h3>
        <p>誰が入力する情報か考えて、inputやtextareaを追加する。</p>
      </div>
      <div class="todo-card">
        <h3>TODO 2</h3>
        <p>AIの回答をどう使うか決めて、結果を表示する場所を追加する。</p>
      </div>
      <div class="todo-card">
        <h3>TODO 3</h3>
        <p>必要ならDB.add()やDB.get()を使い、データを保存する。</p>
      </div>

      <button id="sample-save-button" class="button" type="button">最後の回答をDBへ保存する（制作例）</button>
      <p id="save-status" class="support-message" aria-live="polite"></p>
    </aside>
  </main>

  <footer class="notice">
    <p>AIの回答には誤りが含まれることがあります。重要な情報は必ず確認してください。</p>
  </footer>
</body>
</html>
